
name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: PHP security and static analysis
  php-quality:
    name: PHP security and static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none
          ini-values: memory_limit=1G

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Audit Composer dependencies
        run: composer audit

      - name: Prepare PHPStan configuration
        shell: bash
        run: |
          if [ ! -f phpstan.neon ] && [ -f phpstan.neon.txt ]; then
            cp phpstan.neon.txt phpstan.neon
          fi

      - name: Run Larastan / PHPStan
        run: |
          if [ -f phpstan.neon ]; then
            vendor/bin/phpstan analyse \
              --configuration=phpstan.neon \
              --memory-limit=1G \
              --no-progress
          else
            vendor/bin/phpstan analyse \
              --memory-limit=1G \
              --no-progress
          fi

  # Job 2: Frontend security and build
  frontend-quality:
    name: Frontend security and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install NPM dependencies
        run: npm ci

      - name: Audit production NPM dependencies
        run: npm audit --omit=dev

      - name: Build frontend assets
        run: npm run build

  # Job 3: Laravel tests
  tests:
    name: Laravel test suite
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      APP_DEBUG: "true"
      APP_KEY: base64:2fl+Ktvkfl+Fuz4Qp/A75G2RTiWVA/ZoKZvp6fiiM10=
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, fileinfo
          coverage: none
          ini-values: memory_limit=1G

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Clear Laravel caches
        run: |
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

      - name: Run test suite
        run: php artisan test

